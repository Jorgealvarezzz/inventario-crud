<div class="pagina">
  <h1>Servicios de instalacion</h1>

  <div class="tarjeta-form">
    <h2>{{ editandoId ? 'Editar servicio' : 'Nuevo servicio' }}</h2>
    <div class="campos">
      <label>Nombre <input [(ngModel)]="modelo.nombre" placeholder="Nombre del servicio"></label>
      <label>Descripcion <input [(ngModel)]="modelo.descripcion" placeholder="Descripcion"></label>
      <label>Precio <input type="number" [(ngModel)]="modelo.precio"></label>
      <label>Duracion (min) <input type="number" [(ngModel)]="modelo.duracion_min"></label>
    </div>
    <div class="acciones">
      <button class="btn primario" (click)="guardar()">{{ editandoId ? 'Actualizar' : 'Guardar' }}</button>
      <button class="btn gris" *ngIf="editandoId" (click)="cancelar()">Cancelar</button>
    </div>
  </div>

  <table class="tabla">
    <thead><tr><th>Nombre</th><th>Descripcion</th><th>Precio</th><th>Duracion</th><th>Acciones</th></tr></thead>
    <tbody>
      <tr *ngFor="let s of servicios">
        <td>{{ s.nombre }}</td>
        <td>{{ s.descripcion }}</td>
        <td>${{ s.precio }}</td>
        <td>{{ s.duracion_min }} min</td>
        <td class="td-acciones">
          <button class="btn chico azul" (click)="editar(s)">Editar</button>
          <button class="btn chico rojo" (click)="eliminar(s.id!)">Eliminar</button>
        </td>
      </tr>
      <tr *ngIf="servicios.length === 0"><td colspan="5" class="vacio">Sin servicios</td></tr>
    </tbody>
  </table>
</div>
