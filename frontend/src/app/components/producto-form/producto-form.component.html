<div class="form-wrapper">
  <div class="card-form">

    <h2>{{ editando ? "Editar" : "Nuevo" }} Producto</h2>

    <div class="form-group">
      <label>Nombre</label>
      <input [(ngModel)]="producto.nombre" placeholder="Nombre del producto">
    </div>

    <div class="form-group">
      <label>Categoria</label>
      <input [(ngModel)]="producto.categoria" placeholder="Categoria">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Precio</label>
        <input type="number" [(ngModel)]="producto.precio">
      </div>
      <div class="form-group">
        <label>Stock</label>
        <input type="number" [(ngModel)]="producto.stock">
      </div>
    </div>

    <div class="form-group">
      <label>Descripcion</label>
      <input [(ngModel)]="producto.descripcion" placeholder="Descripcion (opcional)">
    </div>

    <div class="acciones">
      <button class="btn btn-guardar" (click)="guardar()">Guardar</button>
      <button class="btn btn-cancelar" (click)="cancelar()">Cancelar</button>
    </div>

  </div>
</div>
